[package]
name = "pitot-control"
description = "The Pitot window: turns the overlay and each widget on and off, and updates an installed Pitot."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
# The configuration schema and its in-place editing, the paths, and the link to the overlay's tray window.
pitot-overlay = { path = "../overlay" }
serde = { version = "1", features = ["derive"] }
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }

[target."cfg(windows)".dependencies]
# The window's UI framework. It runs only in the window's process (`pitot.exe --window`), never in the overlay's.
gpui = { version = "0.2.2", default-features = false, features = ["windows-manifest"] }
# Both already in gpui's tree: a channel from the link thread to the UI, and the window's HWND.
futures = "0.3"
raw-window-handle = "0.6"
# Finds, downloads, verifies, and installs updates of an installed Pitot from its GitHub releases, in the window's
# process only. Blocking HTTP (ureq, rustls with ring, Mozilla's roots), no async runtime. The same pinned version
# as the executable's start-up hook.
velopack = { version = "=1.2.161", default-features = false }
