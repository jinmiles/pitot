[package]
name = "pitot"
description = "Pitot's executable: the overlay, or with --window the Pitot window, each in a process of its own."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[features]
# Counts the overlay process's heap allocations and logs them at exit (see `pitot_overlay::alloc_count`).
alloc-count = ["pitot-overlay/alloc-count"]

[dependencies]
# The overlay: its widgets draw with GPUI, which runs in the overlay's process too.
pitot-overlay = { path = "../overlay" }
# The Pitot window, which only a process started with --window runs.
pitot-control = { path = "../control" }

[target."cfg(windows)".dependencies]
# The installer's start-up hook. Pinned to the version of the `vpk` tool the release workflow packs with, which
# must match it.
velopack = { version = "=1.2.161", default-features = false }
