[package]
name = "pitot-bench"
description = "Benchmark harness that measures every overlay, including Pitot, the same way."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
csv = "1.4.0"
pitot-irsdk.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "1.2.1", default-features = false, features = ["std", "serde", "parse"] }
zstd = { version = "0.13", default-features = false }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_System_Diagnostics_ToolHelp", "Win32_System_JobObjects", "Win32_System_Performance", "Win32_System_ProcessStatus", "Win32_System_Registry", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_WindowsProgramming"] }
