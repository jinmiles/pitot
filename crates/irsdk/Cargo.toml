[package]
name = "pitot-irsdk"
description = "Telemetry SDK reader: shared memory, .ibt files, session info, and broadcast messages."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# Builds the counting-allocator test that checks the live read path for heap allocations.
alloc-check = []

[dependencies]
saphyr = "0.3.3"

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
