[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.7"
edition = "2024"
rust-version = "1.99"
publish = false
license = "MIT"

[workspace.dependencies]
pitot-irsdk = { path = "crates/irsdk" }

[profile.release]
lto = "fat"
codegen-units = 1
panic = "abort"

# Release settings without fat LTO, for local functional checks and screenshots: it builds in a fraction of the
# time. Release artifacts and benchmark measurements use `--release`.
[profile.fast-release]
inherits = "release"
lto = false
codegen-units = 16
incremental = true
