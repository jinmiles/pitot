# Pitot configuration for benchmarks: the four widgets of the reference set (input trace, relative,
# standings, fuel) at their default positions and rates. The status panel and the widgets outside the set are
# off. Every field is spelled out, so a change of defaults does not change the benchmark. Widgets go on the
# primary monitor: `monitor` is left out, which is how the file says so. The Pitot window does not open
# (start_in_tray), so only the overlay is measured, and would not check for updates (check_updates) if it did.

[general]
font = "Segoe UI"
start_in_tray = true
background_opacity = 80
text_size = 100
check_updates = false

[widgets.status]
enabled = false

[widgets.inputs]
enabled = true
x = 660
y = 952
width = 600
height = 120
rate_hz = 60.0
opacity = 0.80

[widgets.relative]
enabled = true
x = 1456
y = 520
width = 456
height = 396
rate_hz = 10.0
opacity = 0.80

[widgets.standings]
enabled = true
x = 8
y = 72
width = 744
height = 560
rate_hz = 10.0
opacity = 0.80

[widgets.fuel]
enabled = true
x = 1456
y = 924
width = 456
height = 148
rate_hz = 30.0
opacity = 0.80

[widgets.pit]
enabled = false

[widgets.sectors]
enabled = false

[widgets.wind]
enabled = false

[widgets.tires]
enabled = false

[widgets.trackmap]
enabled = false
